# 每个测试方法的默认超时。
#
# 为什么需要它：挂死的测试在日志里**没有名字**。surefire 进入测试类时打一行 "Running X"，
# 结果行要等整个类跑完才打——所以一条挂死的方法只会留下一个开头，然后是无穷无尽的沉默。
# 实测（CI run 33858406329，macos-latest）：InteractiveReplTest 挂了 6 小时把 job 烧到
# GitHub 的执行上限，日志里唯一的线索就是那行 "Running com.cafecli.cli.InteractiveReplTest"。
# 配上这条之后，同一次挂死会变成一条**点名到方法**的失败。
#
# 2m 的余量：`-Pquick` 里最慢的单个方法远在 1s 以下，最慢的**类**是 ScreenTruthRegressionTest
# 的 56 条共 37s。2 分钟对任何单条方法都是极宽松的上限，不会把慢测试误判成挂死。
#
# 这条是**兜底**，不是竞态的修法——竞态本身见 .scratch/ci-and-test-quarantine/issues/03。
# 方法上显式写的 @Timeout 优先于这里，所以已有的 @Timeout(30) 不受影响。
junit.jupiter.execution.timeout.default = 2m

# SEPARATE_THREAD 不是可选项，是这条超时能不能生效的前提——**实测**：
#   SAME_THREAD（默认）  超时设 15s，挂死的测试照样挂过 5 分钟，最后是我手动杀的
#   SEPARATE_THREAD      同一条挂死在 15.03s 变成一条点名到方法的 TimeoutException
# 差别在于 SAME_THREAD 只能给那条线程发中断然后**继续等它自己返回**；线程卡在
# PipedInputStream.read() 里、中断被 JLine 的读循环吞掉，于是永远等不到。SEPARATE_THREAD
# 直接放弃那条线程并把失败报上来。真正的挂死只有后者救得回来。
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
